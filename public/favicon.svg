<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd57a" stop-opacity="1" />
      <stop offset="60%" stop-color="#d5b66c" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#111716" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#111716" stroke="#d5b66c" stroke-width="2"/>
  
  <!-- Outer Glow -->
  <circle cx="50" cy="52" r="28" fill="url(#lanternGlow)"/>
  
  <!-- Lantern top ring -->
  <circle cx="50" cy="22" r="6" fill="none" stroke="#e2c77b" stroke-width="3"/>
  
  <!-- Lantern cap roof -->
  <polygon points="50,28 32,42 68,42" fill="#d5b66c" stroke="#8c7743" stroke-width="1.5"/>
  
  <!-- Glass body -->
  <rect x="36" y="42" width="28" height="28" rx="2" fill="#243028" stroke="#d5b66c" stroke-width="2"/>
  
  <!-- Flame inside -->
  <path d="M50 48 Q55 56 50 64 Q45 56 50 48 Z" fill="#ff9f43"/>
  <circle cx="50" cy="58" r="3.5" fill="#ffeaa7"/>
  
  <!-- Struts -->
  <line x1="50" y1="42" x2="50" y2="70" stroke="#d5b66c" stroke-width="1.5"/>
  
  <!-- Lantern base -->
  <polygon points="34,70 66,70 62,78 38,78" fill="#d5b66c" stroke="#8c7743" stroke-width="1.5"/>
</svg>
